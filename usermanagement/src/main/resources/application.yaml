server:
  port: 8081

spring:
  application:
    name: usermanagement

  datasource:
    url: jdbc:mysql://localhost:3306/user_db
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false